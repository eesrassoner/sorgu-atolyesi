<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorgu Atölyesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Yön: laboratuvar defteri. Serin kâğıt zemin, kobalt vurgu; SQL mavi, Python hardal. Üstte sabit bar, altında 3 kolon (liste · çalışma · şema). */
:root {
  --zemin: #f2f4f7;
  --yuzey: #ffffff;
  --yuzey-2: #f7f8fa;
  --murekkep: #16202b;
  --soluk: #5b6878;
  --cizgi: #dce1e8;
  --vurgu: #2453c8;
  --vurgu-acik: #e6ecfb;
  --sql: #2453c8;
  --sql-acik: #e6ecfb;
  --py: #9a6a00;
  --py-acik: #fbf1d9;
  --iyi: #13804a;
  --iyi-acik: #e3f4ea;
  --kotu: #c0392b;
  --kotu-acik: #fbe7e4;
  --uyari: #a35a00;
  --kod-zemin: #f4f6f9;
  --h-kw: #2453c8;
  --h-fn: #7b3fb5;
  --h-metin: #0f7a52;
  --h-sayi: #b4530b;
  --h-yorum: #8794a3;
  --golge: 0 1px 2px rgba(22, 32, 43, .06), 0 4px 16px rgba(22, 32, 43, .05);
  --f-baslik: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-govde: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-kod: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --zemin: #0e131a; --yuzey: #151c25; --yuzey-2: #1a222d; --murekkep: #e5eaf0; --soluk: #95a2b2; --cizgi: #283342;
    --vurgu: #7ea2ff; --vurgu-acik: #1c2a4a; --sql: #7ea2ff; --sql-acik: #1c2a4a; --py: #e6b84a; --py-acik: #33290f;
    --iyi: #4cc785; --iyi-acik: #12301f; --kotu: #ff7b6b; --kotu-acik: #3a1a17; --uyari: #f0a14a; --kod-zemin: #10161e;
    --h-kw: #8fb0ff; --h-fn: #c99bff; --h-metin: #6fd3a5; --h-sayi: #f2a65a; --h-yorum: #6c7a8b;
    --golge: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --zemin: #0e131a; --yuzey: #151c25; --yuzey-2: #1a222d; --murekkep: #e5eaf0; --soluk: #95a2b2; --cizgi: #283342;
  --vurgu: #7ea2ff; --vurgu-acik: #1c2a4a; --sql: #7ea2ff; --sql-acik: #1c2a4a; --py: #e6b84a; --py-acik: #33290f;
  --iyi: #4cc785; --iyi-acik: #12301f; --kotu: #ff7b6b; --kotu-acik: #3a1a17; --uyari: #f0a14a; --kod-zemin: #10161e;
  --h-kw: #8fb0ff; --h-fn: #c99bff; --h-metin: #6fd3a5; --h-sayi: #f2a65a; --h-yorum: #6c7a8b;
  --golge: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--zemin); color: var(--murekkep); font: 15px/1.55 var(--f-govde); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-baslik); font-weight: 700; letter-spacing: -.01em; text-wrap: balance; margin: 0; }
h1 { font-size: 28px; line-height: 1.2; }
h2 { font-size: 20px; line-height: 1.3; }
p { margin: 0 0 .6em; }
code, kbd, pre { font-family: var(--f-kod); font-size: .88em; }
:not(pre) > code { background: var(--kod-zemin); border: 1px solid var(--cizgi); border-radius: 4px; padding: 0 .3em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--vurgu); outline-offset: 2px; }
.gizli { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.kucuk { font-size: 13px; color: var(--soluk); }

/* Üst bar */
.ust { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 20px; padding: 10px max(16px, 2vw); background: var(--yuzey); border-bottom: 1px solid var(--cizgi); flex-wrap: wrap; }
.marka { display: flex; align-items: baseline; gap: 8px; font-family: var(--f-baslik); font-weight: 700; font-size: 19px; white-space: nowrap; }
.marka .imza { font-family: var(--f-kod); font-size: 12px; font-weight: 500; color: var(--soluk); }
.marka .imza b { color: var(--sql); font-weight: 500; } .marka .imza i { color: var(--py); font-style: normal; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav-btn { background: none; border: 0; padding: 7px 12px; border-radius: 8px; cursor: pointer; color: var(--soluk); font-weight: 500; }
.nav-btn:hover { background: var(--yuzey-2); color: var(--murekkep); }
.nav-btn[aria-current="page"] { background: var(--vurgu-acik); color: var(--vurgu); }
.ust-sag { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ust-sag label { font-size: 13px; color: var(--soluk); }
.ust-sag select { background: var(--yuzey-2); border: 1px solid var(--cizgi); border-radius: 8px; padding: 5px 8px; }
.hap { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: var(--yuzey-2); border: 1px solid var(--cizgi); color: var(--soluk); white-space: nowrap; font-variant-numeric: tabular-nums; }
#pyDurum[data-durum="yukleniyor"] { color: var(--py); border-color: color-mix(in srgb, var(--py) 40%, transparent); }
#pyDurum[data-durum="hazir"] { color: var(--iyi); }
#pyDurum[data-durum="hata"] { color: var(--kotu); }

main { padding: 18px max(16px, 2vw) 40px; }
@media (max-width: 820px) { .ust { position: static; } }

/* Kolonlar */
.uc-kolon { display: grid; grid-template-columns: 290px minmax(0, 1fr) 230px; gap: 18px; align-items: start; }
.iki-kolon { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 18px; align-items: start; }
.iki-kolon.serbest, .iki-kolon.mulakat-govde { grid-template-columns: minmax(0, 1fr) 240px; }
@media (max-width: 1180px) { .uc-kolon { grid-template-columns: 260px minmax(0, 1fr); } .uc-kolon > .sema { grid-column: 1 / -1; } }
@media (max-width: 820px) { .uc-kolon, .iki-kolon, .iki-kolon.serbest, .iki-kolon.mulakat-govde { grid-template-columns: 1fr; } }

/* Soru listesi */
.soru-liste { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: var(--r); padding: 12px; position: sticky; top: 74px; max-height: calc(100vh - 92px); overflow: auto; }
@media (max-width: 820px) { .soru-liste { position: static; max-height: 380px; } }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--yuzey-2); border: 1px solid var(--cizgi); border-radius: 9px; padding: 3px; }
.seg-btn { border: 0; background: none; border-radius: 7px; padding: 6px 10px; font-weight: 600; cursor: pointer; color: var(--soluk); }
.seg-btn[aria-selected="true"].dil-sql { background: var(--sql-acik); color: var(--sql); }
.seg-btn[aria-selected="true"].dil-python { background: var(--py-acik); color: var(--py); }
.filtreler { display: grid; gap: 8px; margin: 10px 0; }
.filtreler select { width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--cizgi); background: var(--yuzey); }
.chipler { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { border: 1px solid var(--cizgi); background: var(--yuzey); border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; color: var(--soluk); }
.chip:hover { border-color: var(--vurgu); color: var(--murekkep); }
.chip.secili { background: var(--murekkep); border-color: var(--murekkep); color: var(--yuzey); }
.chip.ok { border-color: var(--iyi); color: var(--iyi); background: var(--iyi-acik); }
.chip.hayir { border-color: var(--kotu); color: var(--kotu); background: var(--kotu-acik); }
.liste-not { margin: 10px 2px; }
.sorular { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.soru-satir { width: 100%; display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 7px 8px; cursor: pointer; }
.soru-satir:hover { background: var(--yuzey-2); }
.soru-satir.aktif { background: var(--vurgu-acik); border-color: color-mix(in srgb, var(--vurgu) 30%, transparent); }
.soru-satir .no { font: 500 12px var(--f-kod); color: var(--soluk); text-align: center; font-variant-numeric: tabular-nums; }
.soru-satir .ad { font-size: 14px; line-height: 1.3; display: grid; }
.soru-satir .kat { font-size: 12px; color: var(--soluk); }
.tik { color: var(--iyi); font-weight: 700; } .carpi { color: var(--kotu); font-weight: 700; }
.sev { font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.sev-1 { color: var(--iyi); background: var(--iyi-acik); } .sev-2 { color: var(--uyari); background: color-mix(in srgb, var(--uyari) 14%, transparent); } .sev-3 { color: var(--kotu); background: var(--kotu-acik); }
.bos-not { padding: 10px; }

/* Çalışma alanı */
.calisma { display: grid; gap: 14px; min-width: 0; }
.soru-kart { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--golge); display: grid; gap: 10px; }
.soru-metni { max-width: 75ch; font-size: 15.5px; }
.rozetler { display: flex; gap: 6px; flex-wrap: wrap; }
.rozet { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 6px; background: var(--yuzey-2); border: 1px solid var(--cizgi); color: var(--soluk); }
.rozet.dil-sql { background: var(--sql-acik); color: var(--sql); border-color: transparent; }
.rozet.dil-python { background: var(--py-acik); color: var(--py); border-color: transparent; }
.rozet.sev-1, .rozet.sev-2, .rozet.sev-3 { border-color: transparent; }
.rozet.uyari { color: var(--uyari); }
.beklenen summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--soluk); text-transform: uppercase; letter-spacing: .04em; }
.beklenen-ic { margin-top: 8px; }

/* Editör */
.editor-alan { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: var(--r); overflow: hidden; box-shadow: var(--golge); }
.editor { display: grid; grid-template-columns: auto 1fr; background: var(--kod-zemin); min-height: var(--h, 200px); height: var(--h, 200px); resize: vertical; overflow: hidden; }
.gutter { margin: 0; padding: 12px 8px 12px 14px; text-align: right; color: var(--h-yorum); user-select: none; overflow: hidden; font: 13.5px/1.6 var(--f-kod); border-right: 1px solid var(--cizgi); min-width: 42px; }
.editor textarea { border: 0; outline: none; resize: none; padding: 12px 14px; background: transparent; font: 13.5px/1.6 var(--f-kod); color: var(--murekkep); tab-size: 4; white-space: pre; overflow: auto; height: 100%; }
.editor textarea::placeholder { color: var(--h-yorum); opacity: 1; font-style: italic; }
.editor textarea:focus::placeholder { color: transparent; }
.editor:focus-within { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--vurgu) 45%, transparent); }
.arac-cubugu { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 12px; border-top: 1px solid var(--cizgi); }
.soru-kart .arac-cubugu, .bos-durum .arac-cubugu { border: 0; padding: 0; }
.ayrac { width: 1px; height: 22px; background: var(--cizgi); margin: 0 4px; }
.btn { border: 1px solid var(--cizgi); background: var(--yuzey); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover:not(:disabled) { border-color: var(--soluk); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.birincil { background: var(--vurgu); border-color: var(--vurgu); color: #fff; }
:root[data-theme="dark"] .btn.birincil { color: #0e131a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.birincil { color: #0e131a; } }
.btn.birincil:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--vurgu); }
.btn.vurgu { border-color: var(--vurgu); color: var(--vurgu); font-weight: 600; }
.btn.hafif { background: var(--yuzey-2); }
.btn.genis { width: 100%; justify-content: center; padding: 10px; }
.kucuk-btn { padding: 4px 10px; font-size: 13px; margin-top: 8px; }
kbd { font-size: 10.5px; padding: 1px 5px; border-radius: 4px; background: rgba(255, 255, 255, .2); border: 1px solid rgba(255, 255, 255, .35); }

/* Çıktı */
.cikti { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: var(--r); padding: 14px; min-height: 90px; }
.cikti-bos { color: var(--soluk); font-size: 14px; }
.tablo-kap { overflow: auto; max-height: 420px; border: 1px solid var(--cizgi); border-radius: 8px; }
table.sonuc { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.sonuc th { position: sticky; top: 0; background: var(--yuzey-2); text-align: left; font: 500 12.5px var(--f-kod); padding: 7px 12px; border-bottom: 1px solid var(--cizgi); white-space: nowrap; }
table.sonuc td { padding: 6px 12px; border-bottom: 1px solid var(--cizgi); white-space: nowrap; max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
table.sonuc tr:last-child td { border-bottom: 0; }
table.sonuc td.say { text-align: right; font-family: var(--f-kod); font-size: 12.5px; }
table.sonuc td.null { color: var(--h-yorum); font: italic 12px var(--f-kod); }
.tablo-alt, .sure { font-size: 12.5px; color: var(--soluk); margin-top: 6px; font-variant-numeric: tabular-nums; }
.sure { display: inline-block; }
.hata-kutu { background: var(--kotu-acik); border: 1px solid color-mix(in srgb, var(--kotu) 35%, transparent); color: var(--murekkep); border-radius: 8px; padding: 10px 12px; }
.hata-kutu b { color: var(--kotu); }
.hata-kutu pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; }
.bilgi { background: var(--vurgu-acik); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.konsol { margin-bottom: 10px; } .konsol pre { margin: 4px 0 0; background: var(--kod-zemin); border: 1px solid var(--cizgi); border-radius: 8px; padding: 10px; max-height: 220px; overflow: auto; white-space: pre-wrap; }
.konsol-baslik, .ek-baslik { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--soluk); margin: 4px 0 6px; }
.yukleniyor { color: var(--soluk); font-size: 14px; display: flex; gap: 10px; align-items: center; }
.yukleniyor::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--cizgi); border-top-color: var(--vurgu); animation: don .8s linear infinite; flex: none; }
@keyframes don { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .yukleniyor::before { animation: none; } }

/* Karar & ek kutular */
.karar { display: flex; gap: 12px; align-items: flex-start; border-radius: var(--r); padding: 12px 16px; border: 1px solid; }
.karar.dogru { background: var(--iyi-acik); border-color: color-mix(in srgb, var(--iyi) 40%, transparent); }
.karar.yanlis { background: var(--kotu-acik); border-color: color-mix(in srgb, var(--kotu) 35%, transparent); }
.karar-ikon { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; }
.karar.dogru .karar-ikon { background: var(--iyi); } .karar.yanlis .karar-ikon { background: var(--kotu); }
:root[data-theme="dark"] .karar-ikon { color: #0e131a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .karar-ikon { color: #0e131a; } }
#ekKutular { display: grid; gap: 12px; }
#ekKutular:empty { display: none; }
.ek-kutu { background: var(--yuzey); border: 1px solid var(--cizgi); border-left: 3px solid var(--vurgu); border-radius: var(--r); padding: 12px 16px; }
.ek-kutu.kIpucu { border-left-color: var(--uyari); }
.ek-kutu.kNeden { border-left-color: var(--iyi); }
.ek-kutu.kClaude { border-left-color: var(--h-fn); }
.aciklama, .claude-metin { max-width: 75ch; }
.aciklama ul, .claude-metin ul, .ek-kutu ul { margin: .3em 0 .7em; padding-left: 1.2em; }
.kod-blok { background: var(--kod-zemin); border: 1px solid var(--cizgi); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0; line-height: 1.6; font-size: 13.5px; }
.kod-blok code { font-size: inherit; }
.h-kw { color: var(--h-kw); font-weight: 500; } .h-fn { color: var(--h-fn); } .h-metin { color: var(--h-metin); } .h-sayi { color: var(--h-sayi); } .h-yorum { color: var(--h-yorum); font-style: italic; }
.gezinme { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* Şema */
.sema { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: var(--r); padding: 12px; position: sticky; top: 74px; max-height: calc(100vh - 92px); overflow: auto; font-size: 13px; }
@media (max-width: 1180px) { .uc-kolon > .sema { position: static; max-height: none; } }
.sema-baslik { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 8px; }
.sema-tablo { border-top: 1px solid var(--cizgi); padding: 6px 0; }
.sema-tablo summary { cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.sema-tablo ul { list-style: none; margin: 4px 0 0; padding: 0 0 0 12px; }
.sema-tablo li { display: flex; justify-content: space-between; gap: 6px; }
.ekle-btn { background: none; border: 0; padding: 1px 2px; cursor: pointer; font: 12.5px var(--f-kod); color: var(--murekkep); text-align: left; border-radius: 4px; }
.ekle-btn:hover { background: var(--vurgu-acik); color: var(--vurgu); }
.tablo-ad { font-weight: 600; }
.tip { color: var(--h-yorum); font: 11.5px var(--f-kod); }
.sema-not { margin-top: 10px; }

/* Tahmin */
.secenekler { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.secenekler.dikey { grid-template-columns: 1fr; }
.secenek { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border: 1px solid var(--cizgi); border-radius: 9px; background: var(--yuzey); cursor: pointer; font-family: var(--f-kod); font-size: 14px; }
.secenekler.dikey .secenek { font-family: var(--f-govde); font-size: 15px; }
.secenek:hover:not(:disabled) { border-color: var(--vurgu); background: var(--vurgu-acik); }
.secenek:disabled { cursor: default; }
.secenek .harf { flex: none; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--yuzey-2); border: 1px solid var(--cizgi); font: 600 12px var(--f-govde); color: var(--soluk); }
.secenek.dogru { border-color: var(--iyi); background: var(--iyi-acik); } .secenek.dogru .harf { background: var(--iyi); color: #fff; border-color: var(--iyi); }
.secenek.yanlis { border-color: var(--kotu); background: var(--kotu-acik); } .secenek.yanlis .harf { background: var(--kotu); color: #fff; border-color: var(--kotu); }
#tahminSonuc { display: grid; gap: 12px; }
#tahminSonuc:empty { display: none; }

/* Mülakat */
.mulakat-giris { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }
.giris-baslik p { color: var(--soluk); max-width: 70ch; margin-top: 6px; }
.mod-kartlar { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.mod-kart, .veri-kart { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 14px; padding: 20px; display: grid; gap: 14px; align-content: start; box-shadow: var(--golge); }
.mod-ust p { color: var(--soluk); margin-top: 6px; }
.mod-etiket { font: 500 12px var(--f-kod); color: var(--vurgu); text-transform: uppercase; letter-spacing: .06em; }
fieldset { border: 0; padding: 0; margin: 0; }
legend { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.radyo { display: flex; gap: 6px; flex-wrap: wrap; }
.radyo label { cursor: pointer; }
.radyo input { position: absolute; opacity: 0; }
.radyo span { display: inline-block; padding: 6px 12px; border: 1px solid var(--cizgi); border-radius: 8px; font-size: 14px; background: var(--yuzey-2); }
.radyo input:checked + span { background: var(--vurgu-acik); border-color: var(--vurgu); color: var(--vurgu); font-weight: 600; }
.radyo input:focus-visible + span { outline: 2px solid var(--vurgu); outline-offset: 2px; }
.mulakat-ust { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: var(--r); padding: 10px 14px; margin-bottom: 14px; }
.mulakat-ust .btn { margin-left: auto; }
.ilerleme-noktalar { display: flex; gap: 6px; flex-wrap: wrap; }
.nokta { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--cizgi); background: var(--yuzey-2); font: 600 12.5px var(--f-govde); cursor: pointer; color: var(--soluk); }
.nokta.aktif { border: 2px solid var(--vurgu); color: var(--vurgu); }
.nokta.ok { background: var(--iyi); border-color: var(--iyi); color: #fff; }
.nokta.hayir { background: var(--kotu-acik); border-color: var(--kotu); color: var(--kotu); }
.nokta.cevap { background: var(--vurgu-acik); }
.sayac { font: 600 22px var(--f-kod); font-variant-numeric: tabular-nums; padding: 2px 12px; border-radius: 8px; background: var(--yuzey-2); }
.sayac.az { color: var(--kotu); background: var(--kotu-acik); }
.mulakat-govde + .gezinme { margin-top: 14px; }
.teorik { max-width: 860px; margin: 0 auto; display: grid; gap: 0; }
.teorik .gezinme { margin-top: 14px; }
.teorik-kart h2 { font-size: 21px; }
.acik-cevap { width: 100%; min-height: 180px; padding: 12px; border-radius: 9px; border: 1px solid var(--cizgi); background: var(--yuzey-2); resize: vertical; line-height: 1.55; }
.deger { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; border: 1px solid var(--cizgi); border-radius: var(--r); padding: 14px; background: var(--yuzey-2); }
.deger-puan { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; align-content: center; border: 3px solid; }

.alinti { border-left: 3px solid var(--cizgi); padding-left: 12px; color: var(--soluk); white-space: pre-wrap; }

/* Karne */
.karne { max-width: 960px; margin: 0 auto; display: grid; gap: 16px; }
.karne-ust { display: flex; justify-content: space-between; gap: 20px; align-items: center; background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 14px; padding: 20px 24px; box-shadow: var(--golge); }
.karne-ust h1 { margin: 4px 0 6px; }
.karne-skor { --oran: 0; width: 96px; height: 96px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--iyi) calc(var(--oran) * 360deg), var(--cizgi) 0); }
.karne-skor span { width: 74px; height: 74px; border-radius: 50%; background: var(--yuzey); display: grid; place-items: center; font: 700 20px var(--f-baslik); }
.kat-ozet { display: flex; gap: 6px; flex-wrap: wrap; }
.karne-liste { display: grid; gap: 8px; }
.karne-satir { background: var(--yuzey); border: 1px solid var(--cizgi); border-left: 4px solid var(--cizgi); border-radius: var(--r); }
.karne-satir.ok { border-left-color: var(--iyi); } .karne-satir.hayir { border-left-color: var(--kotu); }

.durum-ikon { font-weight: 700; width: 18px; text-align: center; }
.karne-satir.ok .durum-ikon { color: var(--iyi); } .karne-satir.hayir .durum-ikon { color: var(--kotu); } .karne-satir.bos .durum-ikon { color: var(--soluk); }
.karne-detay { padding: 0 16px 16px; display: grid; gap: 8px; }

/* Serbest */
.serbest-ust { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.serbest-ust .seg { width: 220px; }
.ornekler { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.gecmis ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.gecmis-btn { width: 100%; text-align: left; background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 8px; padding: 6px 10px; cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.gecmis-btn:hover { border-color: var(--vurgu); }
.gecmis-btn code { background: none; border: 0; padding: 0; }

/* Veri */
.veri-sayfa { max-width: 1100px; margin: 0 auto; display: grid; gap: 18px; }
.veri-kartlar { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }

.tablo-ozet { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.tablo-ozet li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; background: var(--yuzey-2); border-radius: 7px; font-size: 13.5px; }
.tablo-ozet span { color: var(--soluk); font-variant-numeric: tabular-nums; }
.aktif-etiket { font-size: 13px; font-weight: 600; color: var(--vurgu); }
.birak { display: block; border: 2px dashed var(--cizgi); border-radius: 12px; padding: 22px; text-align: center; cursor: pointer; background: var(--yuzey-2); transition: border-color .15s, background .15s; }
.birak:hover, .birak.ustunde { border-color: var(--vurgu); background: var(--vurgu-acik); }
.birak-ic { display: grid; gap: 4px; }
.uret-panel { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 14px; padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; box-shadow: var(--golge); }
.uret-panel > div:first-child p { color: var(--soluk); margin-top: 6px; max-width: 65ch; }

.uret-form { display: flex; gap: 16px; align-items: end; flex-wrap: wrap; }
@media (max-width: 820px) { .uret-panel { grid-template-columns: 1fr; } }
.onizleme { display: grid; gap: 10px; }
.onizleme details { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: var(--r); padding: 10px 14px; }
