<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorgu Atölyesi</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2453c8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sorgu Atölyesi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<style>
/* Yön: laboratuvar defteri. Serin kâğıt zemin, kobalt vurgu; SQL mavi, Python hardal. Üstte sabit bar, altında 3 kolon (liste · çalışma · şema). */
:root {
  --zemin: #f2f4f7;
  --yuzey: #ffffff;
  --yuzey-2: #f7f8fa;
  --murekkep: #16202b;
  --soluk: #5b6878;
  --cizgi: #dce1e8;
  --vurgu: #2453c8;
  --vurgu-acik: #e6ecfb;
  --sql: #2453c8;
  --sql-acik: #e6ecfb;
  --py: #9a6a00;
  --py-acik: #fbf1d9;
  --iyi: #13804a;
  --iyi-acik: #e3f4ea;
  --kotu: #c0392b;
  --kotu-acik: #fbe7e4;
  --uyari: #a35a00;
  --kod-zemin: #f4f6f9;
  --h-kw: #2453c8;
  --h-fn: #7b3fb5;
  --h-metin: #0f7a52;
  --h-sayi: #b4530b;
  --h-yorum: #8794a3;
  --golge: 0 1px 2px rgba(22, 32, 43, .06), 0 4px 16px rgba(22, 32, 43, .05);
  --f-baslik: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-govde: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-kod: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --zemin: #0e131a; --yuzey: #151c25; --yuzey-2: #1a222d; --murekkep: #e5eaf0; --soluk: #95a2b2; --cizgi: #283342;
    --vurgu: #7ea2ff; --vurgu-acik: #1c2a4a; --sql: #7ea2ff; --sql-acik: #1c2a4a; --py: #e6b84a; --py-acik: #33290f;
    --iyi: #4cc785; --iyi-acik: #12301f; --kotu: #ff7b6b; --kotu-acik: #3a1a17; --uyari: #f0a14a; --kod-zemin: #10161e;
    --h-kw: #8fb0ff; --h-fn: #c99bff; --h-metin: #6fd3a5; --h-sayi: #f2a65a; --h-yorum: #6c7a8b;
    --golge: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --zemin: #0e131a; --yuzey: #151c25; --yuzey-2: #1a222d; --murekkep: #e5eaf0; --soluk: #95a2b2; --cizgi: #283342;
  --vurgu: #7ea2ff; --vurgu-acik: #1c2a4a; --sql: #7ea2ff; --sql-acik: #1c2a4a; --py: #e6b84a; --py-acik: #33290f;
  --iyi: #4cc785; --iyi-acik: #12301f; --kotu: #ff7b6b; --kotu-acik: #3a1a17; --uyari: #f0a14a; --kod-zemin: #10161e;
  --h-kw: #8fb0ff; --h-fn: #c99bff; --h-metin: #6fd3a5; --h-sayi: #f2a65a; --h-yorum: #6c7a8b;
  --golge: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--zemin); color: var(--murekkep); font: 15px/1.55 var(--f-govde); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-baslik); font-weight: 700; letter-spacing: -.01em; text-wrap: balance; margin: 0; }
h1 { font-size: 28px; line-height: 1.2; }
h2 { font-size: 20px; line-height: 1.3; }
p { margin: 0 0 .6em; }
code, kbd, pre { font-family: var(--f-kod); font-size: .88em; }
:not(pre) > code { background: var(--kod-zemin); border: 1px solid var(--cizgi); border-radius: 4px; padding: 0 .3em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--vurgu); outline-offset: 2px; }
.gizli { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.kucuk { font-size: 13px; color: var(--soluk); }

/* Üst bar */
.ust { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 20px; padding: 10px max(16px, 2vw); background: var(--yuzey); border-bottom: 1px solid var(--cizgi); flex-wrap: wrap; }
.marka { display: flex; align-items: baseline; gap: 8px; font-family: var(--f-baslik); font-weight: 700; font-size: 19px; white-space: nowrap; }
.marka .imza { font-family: var(--f-kod); font-size: 12px; font-weight: 500; color: var(--soluk); }
.marka .imza b { color: var(--sql); font-weight: 500; } .marka .imza i { color: var(--py); font-style: normal; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav-btn { background: none; border: 0; padding: 7px 12px; border-radius: 8px; cursor: pointer; color: var(--soluk); font-weight: 500; }
.nav-btn:hover { background: var(--yuzey-2); color: var(--murekkep); }
.nav-btn[aria-current="page"] { background: var(--vurgu-acik); color: var(--vurgu); }
.ust-sag { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ust-sag label { font-size: 13px; color: var(--soluk); }
.ust-sag select { background: var(--yuzey-2); border: 1px solid var(--cizgi); border-radius: 8px; padding: 5px 8px; }
.hap { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: var(--yuzey-2); border: 1px solid var(--cizgi); color: var(--soluk); white-space: nowrap; font-variant-numeric: tabular-nums; }
#pyDurum[data-durum="yukleniyor"] { color: var(--py); border-color: color-mix(in srgb, var(--py) 40%, transparent); }
#pyDurum[data-durum="hazir"] { color: var(--iyi); }
#pyDurum[data-durum="hata"] { color: var(--kotu); }

main { padding: 18px max(16px, 2vw) 40px; }
@media (max-width: 820px) { .ust { position: static; } }

/* Kolonlar */
.uc-kolon { display: grid; grid-template-columns: 290px minmax(0, 1fr) 230px; gap: 18px; align-items: start; }
.iki-kolon { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 18px; align-items: start; }
.iki-kolon.serbest, .iki-kolon.mulakat-govde { grid-template-columns: minmax(0, 1fr) 240px; }
@media (max-width: 1180px) { .uc-kolon { grid-template-columns: 260px minmax(0, 1fr); } .uc-kolon > .sema { grid-column: 1 / -1; } }
@media (max-width: 820px) { .uc-kolon, .iki-kolon, .iki-kolon.serbest, .iki-kolon.mulakat-govde { grid-template-columns: 1fr; } }

/* Soru listesi */
.soru-liste { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: var(--r); padding: 12px; position: sticky; top: 74px; max-height: calc(100vh - 92px); overflow: auto; }
@media (max-width: 820px) { .soru-liste { position: static; max-height: 380px; } }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--yuzey-2); border: 1px solid var(--cizgi); border-radius: 9px; padding: 3px; }
.seg-btn { border: 0; background: none; border-radius: 7px; padding: 6px 10px; font-weight: 600; cursor: pointer; color: var(--soluk); }
.seg-btn[aria-selected="true"].dil-sql { background: var(--sql-acik); color: var(--sql); }
.seg-btn[aria-selected="true"].dil-python { background: var(--py-acik); color: var(--py); }
.filtreler { display: grid; gap: 8px; margin: 10px 0; }
.filtreler select { width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--cizgi); background: var(--yuzey); }
.chipler { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { border: 1px solid var(--cizgi); background: var(--yuzey); border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; color: var(--soluk); }
.chip:hover { border-color: var(--vurgu); color: var(--murekkep); }
.chip.secili { background: var(--murekkep); border-color: var(--murekkep); color: var(--yuzey); }
.chip.ok { border-color: var(--iyi); color: var(--iyi); background: var(--iyi-acik); }
.chip.hayir { border-color: var(--kotu); color: var(--kotu); background: var(--kotu-acik); }
.liste-not { margin: 10px 2px; }
.sorular { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.soru-satir { width: 100%; display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 7px 8px; cursor: pointer; }
.soru-satir:hover { background: var(--yuzey-2); }
.soru-satir.aktif { background: var(--vurgu-acik); border-color: color-mix(in srgb, var(--vurgu) 30%, transparent); }
.soru-satir .no { font: 500 12px var(--f-kod); color: var(--soluk); text-align: center; font-variant-numeric: tabular-nums; }
.soru-satir .ad { font-size: 14px; line-height: 1.3; display: grid; }
.soru-satir .kat { font-size: 12px; color: var(--soluk); }
.tik { color: var(--iyi); font-weight: 700; } .carpi { color: var(--kotu); font-weight: 700; }
.sev { font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.sev-1 { color: var(--iyi); background: var(--iyi-acik); } .sev-2 { color: var(--uyari); background: color-mix(in srgb, var(--uyari) 14%, transparent); } .sev-3 { color: var(--kotu); background: var(--kotu-acik); }
.bos-not { padding: 10px; }

/* Çalışma alanı */
.calisma { display: grid; gap: 14px; min-width: 0; }
.soru-kart { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--golge); display: grid; gap: 10px; }
.soru-metni { max-width: 75ch; font-size: 15.5px; }
.rozetler { display: flex; gap: 6px; flex-wrap: wrap; }
.rozet { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 6px; background: var(--yuzey-2); border: 1px solid var(--cizgi); color: var(--soluk); }
.rozet.dil-sql { background: var(--sql-acik); color: var(--sql); border-color: transparent; }
.rozet.dil-python { background: var(--py-acik); color: var(--py); border-color: transparent; }
.rozet.sev-1, .rozet.sev-2, .rozet.sev-3 { border-color: transparent; }
.rozet.uyari { color: var(--uyari); }
.beklenen summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--soluk); text-transform: uppercase; letter-spacing: .04em; }
.beklenen-ic { margin-top: 8px; }

/* Editör */
.editor-alan { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: var(--r); overflow: hidden; box-shadow: var(--golge); }
.editor { display: grid; grid-template-columns: auto 1fr; background: var(--kod-zemin); min-height: var(--h, 200px); height: var(--h, 200px); resize: vertical; overflow: hidden; }
.gutter { margin: 0; padding: 12px 8px 12px 14px; text-align: right; color: var(--h-yorum); user-select: none; overflow: hidden; font: 13.5px/1.6 var(--f-kod); border-right: 1px solid var(--cizgi); min-width: 42px; }
.editor textarea { border: 0; outline: none; resize: none; padding: 12px 14px; background: transparent; font: 13.5px/1.6 var(--f-kod); color: var(--murekkep); tab-size: 4; white-space: pre; overflow: auto; height: 100%; }
.editor:focus-within { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--vurgu) 45%, transparent); }
.arac-cubugu { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 12px; border-top: 1px solid var(--cizgi); }
.soru-kart .arac-cubugu, .bos-durum .arac-cubugu { border: 0; padding: 0; }
.ayrac { width: 1px; height: 22px; background: var(--cizgi); margin: 0 4px; }
.btn { border: 1px solid var(--cizgi); background: var(--yuzey); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover:not(:disabled) { border-color: var(--soluk); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.birincil { background: var(--vurgu); border-color: var(--vurgu); color: #fff; }
:root[data-theme="dark"] .btn.birincil { color: #0e131a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.birincil { color: #0e131a; } }
.btn.birincil:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--vurgu); }
.btn.vurgu { border-color: var(--vurgu); color: var(--vurgu); font-weight: 600; }
.btn.hafif { background: var(--yuzey-2); }
.btn.genis { width: 100%; justify-content: center; padding: 10px; }
.kucuk-btn { padding: 4px 10px; font-size: 13px; margin-top: 8px; }
kbd { font-size: 10.5px; padding: 1px 5px; border-radius: 4px; background: rgba(255, 255, 255, .2); border: 1px solid rgba(255, 255, 255, .35); }

/* Çıktı */
.cikti { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: var(--r); padding: 14px; min-height: 90px; }
.cikti-bos { color: var(--soluk); font-size: 14px; }
.tablo-kap { overflow: auto; max-height: 420px; border: 1px solid var(--cizgi); border-radius: 8px; }
table.sonuc { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.sonuc th { position: sticky; top: 0; background: var(--yuzey-2); text-align: left; font: 500 12.5px var(--f-kod); padding: 7px 12px; border-bottom: 1px solid var(--cizgi); white-space: nowrap; }
table.sonuc td { padding: 6px 12px; border-bottom: 1px solid var(--cizgi); white-space: nowrap; max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
table.sonuc tr:last-child td { border-bottom: 0; }
table.sonuc td.say { text-align: right; font-family: var(--f-kod); font-size: 12.5px; }
table.sonuc td.null { color: var(--h-yorum); font: italic 12px var(--f-kod); }
.tablo-alt, .sure { font-size: 12.5px; color: var(--soluk); margin-top: 6px; font-variant-numeric: tabular-nums; }
.sure { display: inline-block; }
.hata-kutu { background: var(--kotu-acik); border: 1px solid color-mix(in srgb, var(--kotu) 35%, transparent); color: var(--murekkep); border-radius: 8px; padding: 10px 12px; }
.hata-kutu b { color: var(--kotu); }
.hata-kutu pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; }
.bilgi { background: var(--vurgu-acik); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.konsol { margin-bottom: 10px; } .konsol pre { margin: 4px 0 0; background: var(--kod-zemin); border: 1px solid var(--cizgi); border-radius: 8px; padding: 10px; max-height: 220px; overflow: auto; white-space: pre-wrap; }
.konsol-baslik, .ek-baslik { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--soluk); margin: 4px 0 6px; }
.yukleniyor { color: var(--soluk); font-size: 14px; display: flex; gap: 10px; align-items: center; }
.yukleniyor::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--cizgi); border-top-color: var(--vurgu); animation: don .8s linear infinite; flex: none; }
@keyframes don { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .yukleniyor::before { animation: none; } }

/* Karar & ek kutular */
.karar { display: flex; gap: 12px; align-items: flex-start; border-radius: var(--r); padding: 12px 16px; border: 1px solid; }
.karar.dogru { background: var(--iyi-acik); border-color: color-mix(in srgb, var(--iyi) 40%, transparent); }
.karar.yanlis { background: var(--kotu-acik); border-color: color-mix(in srgb, var(--kotu) 35%, transparent); }
.karar-ikon { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; }
.karar.dogru .karar-ikon { background: var(--iyi); } .karar.yanlis .karar-ikon { background: var(--kotu); }
:root[data-theme="dark"] .karar-ikon { color: #0e131a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .karar-ikon { color: #0e131a; } }
#ekKutular { display: grid; gap: 12px; }
#ekKutular:empty { display: none; }
.ek-kutu { background: var(--yuzey); border: 1px solid var(--cizgi); border-left: 3px solid var(--vurgu); border-radius: var(--r); padding: 12px 16px; }
.ek-kutu.kIpucu { border-left-color: var(--uyari); }
.ek-kutu.kNeden { border-left-color: var(--iyi); }
.ek-kutu.kClaude { border-left-color: var(--h-fn); }
.aciklama, .claude-metin { max-width: 75ch; }
.aciklama ul, .claude-metin ul, .ek-kutu ul { margin: .3em 0 .7em; padding-left: 1.2em; }
.kod-blok { background: var(--kod-zemin); border: 1px solid var(--cizgi); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0; line-height: 1.6; font-size: 13.5px; }
.kod-blok code { font-size: inherit; }
.h-kw { color: var(--h-kw); font-weight: 500; } .h-fn { color: var(--h-fn); } .h-metin { color: var(--h-metin); } .h-sayi { color: var(--h-sayi); } .h-yorum { color: var(--h-yorum); font-style: italic; }
.gezinme { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* Şema */
.sema { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: var(--r); padding: 12px; position: sticky; top: 74px; max-height: calc(100vh - 92px); overflow: auto; font-size: 13px; }
@media (max-width: 1180px) { .uc-kolon > .sema { position: static; max-height: none; } }
.sema-baslik { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 8px; }
.sema-tablo { border-top: 1px solid var(--cizgi); padding: 6px 0; }
.sema-tablo summary { cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.sema-tablo ul { list-style: none; margin: 4px 0 0; padding: 0 0 0 12px; }
.sema-tablo li { display: flex; justify-content: space-between; gap: 6px; }
.ekle-btn { background: none; border: 0; padding: 1px 2px; cursor: pointer; font: 12.5px var(--f-kod); color: var(--murekkep); text-align: left; border-radius: 4px; }
.ekle-btn:hover { background: var(--vurgu-acik); color: var(--vurgu); }
.tablo-ad { font-weight: 600; }
.tip { color: var(--h-yorum); font: 11.5px var(--f-kod); }
.sema-not { margin-top: 10px; }

/* Tahmin */
.secenekler { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.secenekler.dikey { grid-template-columns: 1fr; }
.secenek { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border: 1px solid var(--cizgi); border-radius: 9px; background: var(--yuzey); cursor: pointer; font-family: var(--f-kod); font-size: 14px; }
.secenekler.dikey .secenek { font-family: var(--f-govde); font-size: 15px; }
.secenek:hover:not(:disabled) { border-color: var(--vurgu); background: var(--vurgu-acik); }
.secenek:disabled { cursor: default; }
.secenek .harf { flex: none; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--yuzey-2); border: 1px solid var(--cizgi); font: 600 12px var(--f-govde); color: var(--soluk); }
.secenek.dogru { border-color: var(--iyi); background: var(--iyi-acik); } .secenek.dogru .harf { background: var(--iyi); color: #fff; border-color: var(--iyi); }
.secenek.yanlis { border-color: var(--kotu); background: var(--kotu-acik); } .secenek.yanlis .harf { background: var(--kotu); color: #fff; border-color: var(--kotu); }
#tahminSonuc { display: grid; gap: 12px; }
#tahminSonuc:empty { display: none; }

/* Mülakat */
.mulakat-giris { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }
.giris-baslik p { color: var(--soluk); max-width: 70ch; margin-top: 6px; }
.mod-kartlar { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.mod-kart, .veri-kart { background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 14px; padding: 20px; display: grid; gap: 14px; align-content: start; box-shadow: var(--golge); }
.mod-ust p { color: var(--soluk); margin-top: 6px; }
.mod-etiket { font: 500 12px var(--f-kod); color: var(--vurgu); text-transform: uppercase; letter-spacing: .06em; }
fieldset { border: 0; padding: 0; margin: 0; }
legend { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.radyo { display: flex; gap: 6px; flex-wrap: wrap; }
.radyo label { cursor: pointer; }
.radyo input { position: absolute; opacity: 0; }

<script>
// Örnek Mağaza veri seti: sabit tohumla üretilir, her açılışta aynı data.
function ornekVeriUret() {
  let seed = 20241111;
  const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const pick = a => a[Math.floor(rnd() * a.length)];
  const wpick = (a, w) => { let r = rnd() * w.reduce((x, y) => x + y, 0); for (let i = 0; i < a.length; i++) { r -= w[i]; if (r < 0) return a[i]; } return a[a.length - 1]; };
  const pad = n => String(n).padStart(2, '0');
  const fmt = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
  const randDate = (a, b) => new Date(a.getTime() + Math.floor(rnd() * ((b - a) / 864e5 + 1)) * 864e5);

  const adlarK = ['Ayşe', 'Zeynep', 'Elif', 'Merve', 'Esra', 'Selin', 'Deniz', 'Burcu', 'Ece', 'Gizem', 'Seda', 'Derya', 'Nazlı', 'Pınar', 'İrem', 'Büşra'];
  const adlarE = ['Mehmet', 'Ahmet', 'Mustafa', 'Emre', 'Can', 'Burak', 'Kerem', 'Murat', 'Onur', 'Serkan', 'Oğuz', 'Barış', 'Tolga', 'Cem', 'Umut', 'Kaan'];
  const soyadlar = ['Yılmaz', 'Kaya', 'Demir', 'Şahin', 'Çelik', 'Yıldız', 'Öztürk', 'Aydın', 'Arslan', 'Doğan', 'Kılıç', 'Aslan', 'Koç', 'Kurt', 'Özdemir', 'Polat', 'Erdem', 'Tekin'];
  const sehirler = ['İstanbul', 'Ankara', 'İzmir', 'Bursa', 'Antalya', 'Adana', 'Konya', 'Eskişehir'];
  const sehirW = [30, 16, 13, 9, 9, 7, 8, 8];

  const musteriler = [];
  for (let i = 1; i <= 80; i++) {
    const cins = rnd() < 0.55 ? 'K' : 'E';
    musteriler.push({
      musteri_id: i,
      ad_soyad: `${pick(cins === 'K' ? adlarK : adlarE)} ${pick(soyadlar)}`,
      cinsiyet: cins,
      yas: rnd() < 0.07 ? null : 18 + Math.floor(rnd() * 48),
      sehir: rnd() < 0.05 ? null : wpick(sehirler, sehirW),
      kayit_tarihi: fmt(randDate(new Date(Date.UTC(2022, 0, 1)), new Date(Date.UTC(2024, 5, 30)))),
      uyelik: wpick(['Standart', 'Gold', 'Platinum'], [60, 28, 12])
    });
  }

  const urunHam = [
    ['Koşu Ayakkabısı Pro', 'Ayakkabı', 'Velox', 2849.9], ['Günlük Sneaker', 'Ayakkabı', 'Urbo', 1799.5], ['Deri Bot', 'Ayakkabı', 'Taşkın', 3299], ['Spor Terlik', 'Ayakkabı', 'Velox', 449.9],
    ['Basketbol Ayakkabısı', 'Ayakkabı', 'Hoopa', 3599.9], ['Klasik Loafer', 'Ayakkabı', 'Taşkın', 2299], ['Yürüyüş Botu', 'Ayakkabı', 'Patika', 2699.5],
    ['Pamuklu Tişört', 'Giyim', 'Urbo', 349.9], ['Spor Eşofman Altı', 'Giyim', 'Velox', 899.9], ['Kapüşonlu Sweatshirt', 'Giyim', 'Urbo', 1149], ['Rüzgarlık Mont', 'Giyim', 'Patika', 1899.9],
    ['Spor Tayt', 'Giyim', 'Velox', 649.5], ['Keten Gömlek', 'Giyim', 'Taşkın', 799],
    ['Sırt Çantası', 'Çanta', 'Patika', 1249.9], ['Spor Çanta', 'Çanta', 'Velox', 999.5], ['Deri Cüzdan', 'Çanta', 'Taşkın', 599.9], ['Laptop Çantası', 'Çanta', 'Urbo', 1399],
    ['Spor Çorap 3lü', 'Aksesuar', 'Velox', 189.9], ['Beyzbol Şapkası', 'Aksesuar', 'Hoopa', 299.5], ['Akıllı Bileklik', 'Aksesuar', 'Urbo', 1599.9], ['Matara 750ml', 'Aksesuar', 'Patika', 249],
    ['Yoga Matı', 'Spor Ekipmanı', 'Velox', 549.9], ['Dambıl Seti', 'Spor Ekipmanı', 'Hoopa', 1749], ['Basketbol Topu', 'Spor Ekipmanı', 'Hoopa', 699.9]
  ];
  const urunler = urunHam.map((u, i) => ({ urun_id: 101 + i, urun_adi: u[0], kategori: u[1], marka: u[2], fiyat: u[3] }));
  const urunW = urunler.map(u => u.fiyat < 700 ? 5 : u.fiyat < 1500 ? 4 : u.fiyat < 2500 ? 3 : 2);

  // Bazı müşteriler hiç sipariş vermez (LEFT JOIN alıştırmaları için)
  const siparissiz = new Set([7, 19, 33, 46, 58, 64, 71, 77]);
  const aktif = musteriler.filter(m => !siparissiz.has(m.musteri_id));
  const aktifW = aktif.map(() => 0.3 + rnd() * 2.2);
  const siparisler = [];
  const bitis = new Date(Date.UTC(2024, 11, 31));
  for (let i = 1; i <= 640; i++) {
    const m = wpick(aktif, aktifW);
    const kayit = new Date(m.kayit_tarihi + 'T00:00:00Z');
    const bas = kayit > new Date(Date.UTC(2023, 0, 1)) ? kayit : new Date(Date.UTC(2023, 0, 1));
    const u = wpick(urunler, urunW);
    const adet = wpick([1, 2, 3], [70, 22, 8]);
    const ind = wpick([0, 0.1, 0.2, 0.3], [55, 25, 14, 6]);
    siparisler.push({
      siparis_id: 10000 + i,
      musteri_id: m.musteri_id,
      urun_id: u.urun_id,
      siparis_tarihi: fmt(randDate(bas, bitis)),
      adet,
      indirim_orani: ind,
      tutar: Math.round(u.fiyat * adet * (1 - ind) * 100) / 100,
      kanal: wpick(['Online', 'Mobil', 'Mağaza'], [38, 34, 28]),
      durum: wpick(['Tamamlandı', 'İptal', 'İade'], [85, 8, 7])
    });
  }
  // sipariş id'leri tarih sırasına göre olsun
  siparisler.sort((a, b) => a.siparis_tarihi < b.siparis_tarihi ? -1 : a.siparis_tarihi > b.siparis_tarihi ? 1 : a.siparis_id - b.siparis_id);
  siparisler.forEach((s, i) => s.siparis_id = 10001 + i);

  const tablo = (rows, tipler) => ({ columns: Object.keys(rows[0]), types: tipler, rows: rows.map(r => Object.values(r)) });
  return {
    musteriler: tablo(musteriler, ['INTEGER', 'TEXT', 'TEXT', 'INTEGER', 'TEXT', 'TEXT', 'TEXT']),
    urunler: tablo(urunler, ['INTEGER', 'TEXT', 'TEXT', 'TEXT', 'REAL']),
    siparisler: tablo(siparisler, ['INTEGER', 'INTEGER', 'INTEGER', 'TEXT', 'INTEGER', 'REAL', 'REAL', 'TEXT', 'TEXT'])
  };
}

    ipucu: '<code>GROUP BY kategori</code> + <code>COUNT(*)</code>.',
    cozum: 'SELECT kategori, COUNT(*) AS urun_sayisi\nFROM urunler\nGROUP BY kategori;',
    aciklama: '<p><code>GROUP BY</code> satırları kategori değerine göre kovalara ayırır, <code>COUNT(*)</code> her kovadaki satırı sayar.</p><p>Kural: SELECT\'te aggregate fonksiyon içinde olmayan her sütun GROUP BY\'da da olmalı. Burada <code>kategori</code> hem SELECT\'te hem GROUP BY\'da.</p>' },

  // ───────────── SQL · ORTA ─────────────
  { id: 's09', dil: 'sql', seviye: 2, kategori: 'Aggregation', baslik: 'Tamamlanan siparişlerin cirosu',
    soru: 'Durumu <code>Tamamlandı</code> olan siparişlerin toplam tutarını 2 ondalığa yuvarlayarak bul. Sütun adı <code>toplam_ciro</code>.',
    ipucu: '<code>ROUND(SUM(...), 2)</code>',
    cozum: "SELECT ROUND(SUM(tutar), 2) AS toplam_ciro\nFROM siparisler\nWHERE durum = 'Tamamlandı';",
    aciklama: '<p>Ciroyu hesaplarken iptal ve iadeleri dışarıda bırakmak kritik. Gerçek işte "ciro" tanımı genelde KPI sözlüğünde yazar. Mülakatta da "iptalleri dahil ediyor musunuz?" diye sormak artı puandır.</p><p><code>WHERE</code> toplamadan <b>önce</b> çalışır, yani SUM sadece tamamlanan satırların üzerinden alınır.</p>' },
  { id: 's10', dil: 'sql', seviye: 2, kategori: 'Aggregation', baslik: 'Kanal bazında performans',
    soru: 'Tamamlanan siparişler için her <code>kanal</code> için sipariş sayısını (<code>siparis_sayisi</code>) ve ortalama tutarı (<code>ort_tutar</code>, 2 ondalık) bul.',
    ipucu: 'Önce WHERE ile filtrele, sonra kanal bazında grupla.',
    cozum: "SELECT kanal,\n       COUNT(*) AS siparis_sayisi,\n       ROUND(AVG(tutar), 2) AS ort_tutar\nFROM siparisler\nWHERE durum = 'Tamamlandı'\nGROUP BY kanal;",
    aciklama: '<p>Tek GROUP BY ile birden fazla metrik hesaplanabilir. Sorgunun çalışma sırası şöyle:</p><p><code>FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT</code></p><p>Bu sıra, WHERE\'de neden SELECT\'teki alias\'ı kullanamadığını da açıklar: WHERE çalışırken alias henüz yoktur.</p>' },
  { id: 's11', dil: 'sql', seviye: 2, kategori: 'Aggregation', baslik: 'Sadık müşteriler (HAVING)',
    soru: '12\'den fazla siparişi olan müşterilerin <code>musteri_id</code> ve sipariş sayılarını (<code>siparis_sayisi</code>) getir. Tüm durumlar dahil.',
    ipucu: 'Gruplanmış sonuca filtre koymak için <code>WHERE</code> değil <code>HAVING</code>.',
    cozum: 'SELECT musteri_id, COUNT(*) AS siparis_sayisi\nFROM siparisler\nGROUP BY musteri_id\nHAVING COUNT(*) > 12;',
    aciklama: '<p><b>WHERE</b> tek tek satırları, <b>HAVING</b> grupları filtreler. <code>COUNT(*)</code> ancak gruplama bittikten sonra hesaplanabildiği için koşul HAVING\'e yazılır.</p><p>Mülakat klasiği: "WHERE ile HAVING farkı nedir?" Cevap: çalışma sırası ve filtrelenen seviye (satır mı grup mu).</p>' },
  { id: 's12', dil: 'sql', seviye: 2, kategori: 'Tarih', baslik: 'Yıllık ciro', sirali: true,
    soru: 'Tamamlanan siparişlerin yıllara göre toplam cirosunu bul (<code>yil</code>, <code>ciro</code> 2 ondalık), yıla göre artan sırala.',
    ipucu: 'SQLite\'ta yıl almak için <code>strftime(\'%Y\', siparis_tarihi)</code>.',
    cozum: "SELECT strftime('%Y', siparis_tarihi) AS yil,\n       ROUND(SUM(tutar), 2) AS ciro\nFROM siparisler\nWHERE durum = 'Tamamlandı'\nGROUP BY yil\nORDER BY yil;",
    aciklama: '<p><code>strftime(\'%Y\', tarih)</code> tarihten yıl kısmını metin olarak çıkarır. Aynı fonksiyonla <code>\'%m\'</code> ay, <code>\'%Y-%m\'</code> yıl-ay verir.</p><p>Burada GROUP BY\'da SELECT\'teki alias\'ı (<code>yil</code>) kullandık. İfadenin kendisini tekrar yazmak da (<code>GROUP BY strftime(\'%Y\', siparis_tarihi)</code>) aynı sonucu verir.</p>' },
  { id: 's13', dil: 'sql', seviye: 2, kategori: 'Tarih', baslik: '2024 aylık sipariş sayısı', sirali: true,
    soru: '2024 yılında her ay kaç sipariş verildiğini bul (tüm durumlar). Sütunlar: <code>ay</code> (YYYY-MM formatında), <code>siparis_sayisi</code>. Aya göre sırala.',
    ipucu: '<code>strftime(\'%Y-%m\', ...)</code> ay bazında gruplamak için birebir.',
    cozum: "SELECT strftime('%Y-%m', siparis_tarihi) AS ay,\n       COUNT(*) AS siparis_sayisi\nFROM siparisler\nWHERE siparis_tarihi >= '2024-01-01'\n  AND siparis_tarihi <  '2025-01-01'\nGROUP BY ay\nORDER BY ay;",
    aciklama: '<p>Yıl filtresi için <code>strftime(\'%Y\', tarih) = \'2024\'</code> de doğru sonuç verir. Ama <code>tarih &gt;= ... AND tarih &lt; ...</code> yazımı büyük tablolarda indeks ya da partition kullanabildiği için daha performanslıdır. Fonksiyona sarılmış sütun genelde indeksi devre dışı bırakır.</p>' },
  { id: 's14', dil: 'sql', seviye: 2, kategori: 'JOIN', baslik: 'Sipariş detayına isim ekle', sirali: true,
    soru: 'İlk 10 siparişi (<code>siparis_id</code>\'ye göre) <code>siparis_id</code>, müşterinin <code>ad_soyad</code>\'ı, <code>urun_adi</code> ve <code>tutar</code> ile birlikte listele.',
    ipucu: 'siparisler → musteriler (musteri_id) ve siparisler → urunler (urun_id) iki JOIN.',
    cozum: 'SELECT s.siparis_id, m.ad_soyad, u.urun_adi, s.tutar\nFROM siparisler s\nJOIN musteriler m ON s.musteri_id = m.musteri_id\nJOIN urunler u    ON s.urun_id = u.urun_id\nORDER BY s.siparis_id\nLIMIT 10;',
    aciklama: '<p>Fact tablosu (<code>siparisler</code>) ile iki dimension tablosu birleştiriliyor. Bu klasik star schema mantığı.</p><p>Tablo takma adları (<code>s</code>, <code>m</code>, <code>u</code>) sorguyu kısaltır, aynı isimli sütunlarda da belirsizliği giderir. <code>musteri_id</code> iki tabloda da olduğu için <code>s.</code> öneki şart.</p>' },
  { id: 's15', dil: 'sql', seviye: 2, kategori: 'JOIN', baslik: 'Kategori bazında ciro', sirali: true,
    soru: 'Tamamlanan siparişlerde kategori bazında toplam ciroyu bul (<code>kategori</code>, <code>ciro</code> 2 ondalık), cirosu en yüksek kategori en üstte olsun.',
    ipucu: 'Kategori bilgisi <code>urunler</code> tablosunda. Önce JOIN, sonra GROUP BY.',
    cozum: "SELECT u.kategori, ROUND(SUM(s.tutar), 2) AS ciro\nFROM siparisler s\nJOIN urunler u ON s.urun_id = u.urun_id\nWHERE s.durum = 'Tamamlandı'\nGROUP BY u.kategori\nORDER BY ciro DESC;",
    aciklama: '<p>Önce siparişleri ürünlerle birleştirip her siparişe kategorisini kazandırıyoruz, sonra kategoriye göre topluyoruz.</p><p>Tablolar arasındaki ilişki many-to-one (çok sipariş, tek ürün) olduğu için JOIN satır sayısını artırmaz. One-to-many bir tabloyla JOIN yapıp sonra SUM alırsan değerler şişer. Bu "fan-out" hatası iş hayatında en sık görülen hatalardan.</p>' },
  { id: 's16', dil: 'sql', seviye: 2, kategori: 'JOIN', baslik: 'Hiç sipariş vermemiş müşteriler',
    soru: 'Hiç siparişi olmayan müşterilerin <code>musteri_id</code> ve <code>ad_soyad</code> bilgisini getir.',
    ipucu: '<code>LEFT JOIN</code> yap, sağ tarafı NULL kalanları al.',
    cozum: 'SELECT m.musteri_id, m.ad_soyad\nFROM musteriler m\nLEFT JOIN siparisler s ON m.musteri_id = s.musteri_id\nWHERE s.siparis_id IS NULL;',
    aciklama: '<p><code>LEFT JOIN</code> sol tablodaki tüm müşterileri tutar. Eşleşme bulunamayan müşterilerde sipariş sütunları NULL gelir, <code>WHERE s.siparis_id IS NULL</code> tam olarak onları seçer. Bu kalıba <b>anti-join</b> denir.</p><p>Alternatifler: <code>WHERE musteri_id NOT IN (SELECT musteri_id FROM siparisler)</code> ya da <code>NOT EXISTS</code>. Dikkat: alt sorguda NULL varsa <code>NOT IN</code> hiç satır döndürmez. <code>NOT EXISTS</code> bu yüzden daha güvenli.</p>' },
  { id: 's17', dil: 'sql', seviye: 2, kategori: 'CASE WHEN', baslik: 'Yaş gruplarına ayır',
    soru: 'Müşterileri yaşa göre gruplara ayır ve her grupta kaç kişi olduğunu bul. Gruplar: 18–25 <code>Genç</code>, 26–40 <code>Yetişkin</code>, 41 ve üzeri <code>Olgun</code>, yaşı boş olanlar <code>Bilinmiyor</code>. Sütunlar: <code>yas_grubu</code>, <code>kisi_sayisi</code>.',
    ipucu: '<code>CASE WHEN ... THEN ... ELSE ... END</code> ifadesini GROUP BY ile kullan.',
    cozum: "SELECT CASE\n         WHEN yas IS NULL THEN 'Bilinmiyor'\n         WHEN yas <= 25 THEN 'Genç'\n         WHEN yas <= 40 THEN 'Yetişkin'\n         ELSE 'Olgun'\n       END AS yas_grubu,\n       COUNT(*) AS kisi_sayisi\nFROM musteriler\nGROUP BY yas_grubu;",
    aciklama: '<p><code>CASE</code> koşulları yukarıdan aşağı kontrol eder ve <b>ilk</b> TRUE olanda durur. Bu yüzden <code>yas &lt;= 40</code> koşuluna gelen biri zaten 25\'ten büyüktür, alt sınırı tekrar yazmaya gerek yok.</p><p>NULL kontrolünü en başa koyduk. Koymasaydık NULL yaşlılar hiçbir WHEN\'e uymaz ve ELSE\'e düşüp yanlışlıkla "Olgun" sayılırdı.</p>' },
  { id: 's18', dil: 'sql', seviye: 2, kategori: 'Aggregation', baslik: 'Kanal bazında iptal oranı', sirali: true,
    soru: 'Her kanal için iptal oranını yüzde olarak hesapla (<code>kanal</code>, <code>iptal_orani</code>, 2 ondalık). İptal oranı = İptal durumundaki sipariş / tüm siparişler × 100. Oranı yüksekten düşüğe sırala.',
    ipucu: '<code>AVG(CASE WHEN durum = \'İptal\' THEN 1.0 ELSE 0 END)</code> bir oran verir.',
    cozum: "SELECT kanal,\n       ROUND(100.0 * AVG(CASE WHEN durum = 'İptal' THEN 1 ELSE 0 END), 2) AS iptal_orani\nFROM siparisler\nGROUP BY kanal\nORDER BY iptal_orani DESC;",
    aciklama: '<p>1/0 değişkeninin ortalaması doğrudan oranı verir. <code>SUM(CASE...)/COUNT(*)</code> ile aynı sonuç ama daha kısa.</p><p><b>Tuzak:</b> SQLite\'ta iki tam sayının bölümü tam sayıdır (<code>7/2 = 3</code>). <code>100.0</code> ile çarpmak hesabı ondalığa çevirir.</p>' },

  // ───────────── SQL · ZOR ─────────────
  { id: 's19', dil: 'sql', seviye: 3, kategori: 'Subquery / CTE', baslik: 'Ortalamanın üzerindeki ürünler',
    soru: 'Fiyatı tüm ürünlerin ortalama fiyatından yüksek olan ürünlerin <code>urun_adi</code> ve <code>fiyat</code> bilgilerini getir.',
    ipucu: 'WHERE içinde ortalamayı hesaplayan bir alt sorgu kullan.',
    cozum: 'SELECT urun_adi, fiyat\nFROM urunler\nWHERE fiyat > (SELECT AVG(fiyat) FROM urunler);',
    aciklama: '<p><code>WHERE fiyat &gt; AVG(fiyat)</code> yazamazsın, çünkü aggregate fonksiyonlar WHERE\'de kullanılamaz. Ortalama, tek değer döndüren bir <b>skaler alt sorgu</b> ile ayrıca hesaplanır.</p><p>Alternatif: <code>AVG(fiyat) OVER ()</code> window fonksiyonuyla her satıra ortalamayı ekleyip dış sorguda filtrelemek.</p>' },
  { id: 's20', dil: 'sql', seviye: 3, kategori: 'Window Functions', baslik: 'Her kategorinin en pahalı ürünü',
    soru: 'Her kategorideki en pahalı ürünü bul. Sütunlar: <code>kategori</code>, <code>urun_adi</code>, <code>fiyat</code>.',
    ipucu: '<code>ROW_NUMBER() OVER (PARTITION BY kategori ORDER BY fiyat DESC)</code> ile sıra numarası ver, 1 olanları al.',
    cozum: 'WITH sirali AS (\n  SELECT kategori, urun_adi, fiyat,\n         ROW_NUMBER() OVER (PARTITION BY kategori ORDER BY fiyat DESC) AS rn\n  FROM urunler\n)\nSELECT kategori, urun_adi, fiyat\nFROM sirali\nWHERE rn = 1;',
    aciklama: '<p>"Her grubun en büyüğü / ilk N\'i" sorusu mülakatların bir numaralı window function sorusu.</p><ul><li><code>PARTITION BY kategori</code>: numaralandırma her kategori için baştan başlar.</li><li><code>ORDER BY fiyat DESC</code>: en pahalıya 1 verilir.</li></ul><p>Window fonksiyonları WHERE\'den sonra hesaplandığı için <code>WHERE rn = 1</code> aynı seviyede yazılamaz. Bu yüzden CTE ile bir kat dışarı çıkıyoruz.</p><p>Eşitlik durumunda hepsini istiyorsan <code>ROW_NUMBER</code> yerine <code>RANK</code> kullanırsın.</p>' },
  { id: 's21', dil: 'sql', seviye: 3, kategori: 'Window Functions', baslik: 'En çok harcayan 10 müşteri', sirali: true,
    soru: 'Tamamlanan siparişlere göre müşterileri toplam harcamaya göre sırala. İlk 10 müşterinin <code>musteri_id</code>, <code>toplam_harcama</code> (2 ondalık) ve <code>sira</code> (RANK) bilgisini getir.',
    ipucu: 'Önce müşteri bazında topla (CTE), sonra <code>RANK() OVER (ORDER BY toplam_harcama DESC)</code>.',
    cozum: "WITH harcama AS (\n  SELECT musteri_id, ROUND(SUM(tutar), 2) AS toplam_harcama\n  FROM siparisler\n  WHERE durum = 'Tamamlandı'\n  GROUP BY musteri_id\n)\nSELECT musteri_id, toplam_harcama,\n       RANK() OVER (ORDER BY toplam_harcama DESC) AS sira\nFROM harcama\nORDER BY sira\nLIMIT 10;",
    aciklama: '<p>CTE (<code>WITH</code>) sorguyu adım adım okunur hale getirir: önce müşteri bazında harcama, sonra sıralama.</p><p>Üç sıralama fonksiyonunun farkı (10, 20, 20, 30 için azalan):</p><ul><li><code>ROW_NUMBER</code>: 1, 2, 3, 4 (eşitlikte bile benzersiz)</li><li><code>RANK</code>: 1, 2, 2, 4 (boşluk bırakır)</li><li><code>DENSE_RANK</code>: 1, 2, 2, 3 (boşluk bırakmaz)</li></ul>' },
  { id: 's22', dil: 'sql', seviye: 3, kategori: 'Window Functions', baslik: '2024 kümülatif ciro', sirali: true,
    soru: '2024 yılı için tamamlanan siparişlerin aylık cirosunu ve yılbaşından itibaren kümülatif cirosunu bul. Sütunlar: <code>ay</code> (YYYY-MM), <code>ciro</code>, <code>kumulatif_ciro</code> (ikisi de 2 ondalık).',
    ipucu: 'Önce aylık toplam (CTE), sonra <code>SUM(ciro) OVER (ORDER BY ay)</code>.',
    cozum: "WITH aylik AS (\n  SELECT strftime('%Y-%m', siparis_tarihi) AS ay,\n         SUM(tutar) AS ciro\n  FROM siparisler\n  WHERE durum = 'Tamamlandı'\n    AND siparis_tarihi >= '2024-01-01' AND siparis_tarihi < '2025-01-01'\n  GROUP BY ay\n)\nSELECT ay,\n       ROUND(ciro, 2) AS ciro,\n       ROUND(SUM(ciro) OVER (ORDER BY ay), 2) AS kumulatif_ciro\nFROM aylik\nORDER BY ay;",
    aciklama: '<p><code>SUM(...) OVER (ORDER BY ay)</code> her satırda o aya kadarki (dahil) toplamı verir. ORDER BY verilen bir window\'un varsayılan çerçevesi "baştan bu satıra kadar"dır.</p><p>Yuvarlamayı en sonda yaptık. Ara adımda yuvarlayıp sonra toplarsan küçük kuruş farkları birikir.</p>' },
  { id: 's23', dil: 'sql', seviye: 3, kategori: 'Window Functions', baslik: 'Aylık ciro değişimi (LAG)', sirali: true,
    soru: '2024 için tamamlanan siparişlerin aylık cirosunu, bir önceki ayın cirosunu ve yüzde değişimi bul. Sütunlar: <code>ay</code>, <code>ciro</code>, <code>onceki_ay</code>, <code>degisim_yuzde</code> (hepsi 2 ondalık; ocak için önceki ay ve değişim boş kalsın).',
    ipucu: '<code>LAG(ciro) OVER (ORDER BY ay)</code> bir önceki satırın değerini getirir.',
    cozum: "WITH aylik AS (\n  SELECT strftime('%Y-%m', siparis_tarihi) AS ay,\n         SUM(tutar) AS ciro\n  FROM siparisler\n  WHERE durum = 'Tamamlandı'\n    AND siparis_tarihi >= '2024-01-01' AND siparis_tarihi < '2025-01-01'\n  GROUP BY ay\n)\nSELECT ay,\n       ROUND(ciro, 2) AS ciro,\n       ROUND(LAG(ciro) OVER (ORDER BY ay), 2) AS onceki_ay,\n       ROUND(100.0 * (ciro - LAG(ciro) OVER (ORDER BY ay)) / LAG(ciro) OVER (ORDER BY ay), 2) AS degisim_yuzde\nFROM aylik\nORDER BY ay;",
    aciklama: '<p><code>LAG</code> önceki satırı, <code>LEAD</code> sonraki satırı getirir. İlk satırın önceki değeri olmadığı için NULL döner, NULL ile yapılan hesaplar da NULL olur. Ocak satırında değişim bu yüzden boş.</p><p>Aynı LAG\'ı üç kez yazmamak için iki katmanlı CTE de kurulabilir. Okunabilirlik açısından genelde o daha iyi.</p>' },
  { id: 's24', dil: 'sql', seviye: 3, kategori: 'Subquery / CTE', baslik: 'İkinci en pahalı ürün',
    soru: 'İkinci en yüksek fiyatı bul. Sütun adı <code>ikinci_fiyat</code>.',
    ipucu: 'Birkaç yolu var: <code>LIMIT 1 OFFSET 1</code>, alt sorgu ile <code>MAX</code> ya da <code>DENSE_RANK</code>.',
    cozum: 'SELECT MAX(fiyat) AS ikinci_fiyat\nFROM urunler\nWHERE fiyat < (SELECT MAX(fiyat) FROM urunler);',
    aciklama: '<p>Klasik "N. en yüksek maaş" sorusu. Bu çözüm "en yüksekten küçük olanların en büyüğü" mantığıyla çalışır ve en yüksek değer tekrar etse bile doğru sonuç verir.</p><p><code>ORDER BY fiyat DESC LIMIT 1 OFFSET 1</code> kısa ama en yüksek fiyat iki üründe varsa yine en yükseği döndürür. N. değer için genel ve sağlam çözüm <code>DENSE_RANK() = N</code>.</p>' },
  { id: 's25', dil: 'sql', seviye: 3, kategori: 'Tarih', baslik: 'İlk ve son sipariş arası',
    soru: 'Siparişi olan her müşteri için ilk sipariş tarihi (<code>ilk_siparis</code>), son sipariş tarihi (<code>son_siparis</code>) ve aradaki gün sayısını (<code>gun_farki</code>, tam sayı) bul.',
    ipucu: 'SQLite\'ta gün farkı: <code>julianday(son) - julianday(ilk)</code>.',
    cozum: 'SELECT musteri_id,\n       MIN(siparis_tarihi) AS ilk_siparis,\n       MAX(siparis_tarihi) AS son_siparis,\n       CAST(julianday(MAX(siparis_tarihi)) - julianday(MIN(siparis_tarihi)) AS INTEGER) AS gun_farki\nFROM siparisler\nGROUP BY musteri_id;',
    aciklama: '<p>Tarihlerde <code>MIN</code>/<code>MAX</code> en eski ve en yeni tarihi verir. ISO formatındaki (YYYY-MM-DD) metin tarihler alfabetik sıralandığında da kronolojik sıralanır.</p><p><code>julianday</code> tarihi gün sayısına çevirir, iki tarihin farkı da aradaki gün sayısını verir. <code>CAST(... AS INTEGER)</code> sonucu tam sayıya çevirir.</p>' },
  { id: 's26', dil: 'sql', seviye: 3, kategori: 'Window Functions', baslik: 'Müşterinin favori kategorisi',
    soru: 'Her müşterinin (tamamlanan siparişlere göre) en çok harcama yaptığı kategoriyi bul. Eşitlik olursa alfabetik olarak önce gelen kategori seçilsin. Sütunlar: <code>musteri_id</code>, <code>kategori</code>, <code>harcama</code> (2 ondalık).',
    ipucu: 'Müşteri+kategori bazında topla, sonra müşteri bazında <code>ROW_NUMBER</code> ver. ORDER BY\'a ikinci kriter olarak kategoriyi ekle.',
    cozum: "WITH mk AS (\n  SELECT s.musteri_id, u.kategori, SUM(s.tutar) AS harcama\n  FROM siparisler s\n  JOIN urunler u ON s.urun_id = u.urun_id\n  WHERE s.durum = 'Tamamlandı'\n  GROUP BY s.musteri_id, u.kategori\n), sirali AS (\n  SELECT *, ROW_NUMBER() OVER (PARTITION BY musteri_id ORDER BY harcama DESC, kategori) AS rn\n  FROM mk\n)\nSELECT musteri_id, kategori, ROUND(harcama, 2) AS harcama\nFROM sirali\nWHERE rn = 1;",
    aciklama: '<p>İki aşamalı düşün: <b>1)</b> müşteri × kategori tablosu, <b>2)</b> her müşteri içinde sıralayıp 1. olanı seç.</p><p><code>ORDER BY harcama DESC, kategori</code> eşitliği bozan (tie-breaker) ikinci kriter. Bunu yazmazsan eşitlik durumunda hangi satırın geleceği belirsiz kalır, sorgu her çalıştığında farklı sonuç verebilir.</p>' },
  { id: 's27', dil: 'sql', seviye: 3, kategori: 'Subquery / CTE', baslik: 'Kayıt yılına göre 2024 aktiflik', sirali: true,
    soru: 'Müşterileri kayıt yılına göre grupla. Her yıl için müşteri sayısını (<code>musteri_sayisi</code>) ve bu müşterilerden 2024\'te en az bir tamamlanan siparişi olanların yüzdesini (<code>aktif_yuzde</code>, 2 ondalık) bul. Sütunlar: <code>kayit_yili</code>, <code>musteri_sayisi</code>, <code>aktif_yuzde</code>.',
    ipucu: '2024\'te aktif olan müşteri id\'lerini bir CTE\'de topla, sonra müşterilerle LEFT JOIN yap.',
    cozum: "WITH aktif AS (\n  SELECT DISTINCT musteri_id\n  FROM siparisler\n  WHERE durum = 'Tamamlandı'\n    AND siparis_tarihi >= '2024-01-01' AND siparis_tarihi < '2025-01-01'\n)\nSELECT strftime('%Y', m.kayit_tarihi) AS kayit_yili,\n       COUNT(*) AS musteri_sayisi,\n       ROUND(100.0 * COUNT(a.musteri_id) / COUNT(*), 2) AS aktif_yuzde\nFROM musteriler m\nLEFT JOIN aktif a ON m.musteri_id = a.musteri_id\nGROUP BY kayit_yili\nORDER BY kayit_yili;",
    aciklama: '<p>Basit bir cohort analizi. Kritik nokta <code>DISTINCT</code>: aktif CTE\'sinde her müşteri bir kez olmalı. Yoksa LEFT JOIN müşteriyi sipariş sayısı kadar çoğaltır ve <code>COUNT(*)</code> şişer.</p><p><code>COUNT(a.musteri_id)</code> sadece eşleşen, yani aktif olan müşterileri sayar, çünkü eşleşmeyenlerde değer NULL\'dır.</p>' },
  { id: 's28', dil: 'sql', seviye: 3, kategori: 'Window Functions', baslik: 'Müşterinin önceki siparişi',
    soru: 'Her siparişin, aynı müşterinin bir önceki siparişinden kaç gün sonra verildiğini bul (<code>siparis_id</code>, <code>musteri_id</code>, <code>siparis_tarihi</code>, <code>gun_arasi</code>). Müşterinin ilk siparişinde gun_arasi boş kalsın. Aynı gün birden fazla sipariş varsa siparis_id sırasını kullan.',
    ipucu: '<code>LAG(siparis_tarihi) OVER (PARTITION BY musteri_id ORDER BY siparis_tarihi, siparis_id)</code>',
    cozum: 'SELECT siparis_id, musteri_id, siparis_tarihi,\n       CAST(julianday(siparis_tarihi)\n          - julianday(LAG(siparis_tarihi) OVER (PARTITION BY musteri_id ORDER BY siparis_tarihi, siparis_id)) AS INTEGER) AS gun_arasi\nFROM siparisler;',
    aciklama: '<p>Satın alma sıklığı (purchase frequency) ve churn analizlerinin temel adımı. <code>PARTITION BY musteri_id</code> sayesinde LAG müşteri değiştiğinde sıfırlanır, yani bir müşterinin önceki siparişi başka müşterinin siparişi olmaz.</p><p>Bu sonuçla "müşteriler ortalama kaç günde bir tekrar alıyor?" sorusu tek bir AVG ile cevaplanabilir.</p>' },

  // ───────────── PYTHON · KOLAY ─────────────
  { id: 'p01', dil: 'python', seviye: 1, kategori: 'pandas Temelleri', baslik: 'Tablonun boyutu',
    soru: '<code>musteriler</code> DataFrame\'inin satır ve sütun sayısını <code>sonuc</code> değişkenine ata.',
    ipucu: 'Bir DataFrame\'in boyutu bir özellik (attribute), parantez yok.',
    cozum: 'sonuc = musteriler.shape',
    aciklama: '<p><code>df.shape</code> (satır, sütun) şeklinde bir tuple döner. Parantezsiz yazılır çünkü metot değil özelliktir. Benzerleri: <code>df.columns</code>, <code>df.dtypes</code>, <code>df.index</code>.</p><p>Yeni bir veriyle karşılaşınca ilk bakılacaklar: <code>shape</code>, <code>head()</code>, <code>info()</code>, <code>describe()</code>, <code>isnull().sum()</code>.</p>' },
  { id: 'p02', dil: 'python', seviye: 1, kategori: 'Filtreleme', baslik: '1000 TL üstü ürünler',
    soru: 'Fiyatı 1000\'den büyük ürünlerin sadece <code>urun_adi</code> ve <code>fiyat</code> sütunlarını <code>sonuc</code>\'a ata.',
    ipucu: '<code>df.loc[koşul, [sütunlar]]</code>',
    cozum: 'sonuc = urunler.loc[urunler["fiyat"] > 1000, ["urun_adi", "fiyat"]]',
    aciklama: '<p><code>loc[satır_seçimi, sütun_seçimi]</code> tek adımda hem filtreler hem sütun seçer. <code>urunler["fiyat"] &gt; 1000</code> True/False serisi (boolean mask) üretir, loc sadece True olan satırları alır.</p><p>Alternatif: <code>urunler[urunler.fiyat &gt; 1000][["urun_adi","fiyat"]]</code>. Çalışır ama zincirleme indeksleme sonradan atama yaparken <code>SettingWithCopyWarning</code>\'e yol açabilir.</p>' },
  { id: 'p03', dil: 'python', seviye: 1, kategori: 'Eksik Veri', baslik: 'Eksik değer sayısı',
    soru: '<code>musteriler</code> tablosunda her sütunda kaç eksik (NaN) değer olduğunu <code>sonuc</code>\'a ata.',
    ipucu: '<code>isnull()</code> ve <code>sum()</code> zincirlenebilir.',
    cozum: 'sonuc = musteriler.isnull().sum()',
    aciklama: '<p><code>isnull()</code> her hücre için True/False döner, <code>sum()</code> True\'ları 1 sayarak her sütunu toplar. Sonuç, index\'i sütun adları olan bir Series olur.</p><p>Oran olarak görmek için <code>musteriler.isnull().mean() * 100</code> yazabilirsin. Miuul\'deki <code>missing_values_table</code> fonksiyonu da bu mantıkla çalışıyor.</p>' },
  { id: 'p04', dil: 'python', seviye: 1, kategori: 'Gruplama', baslik: 'Kategori başına ürün',
    soru: 'Her kategoride kaç ürün olduğunu <code>sonuc</code>\'a ata.',
    ipucu: 'Bir sütundaki değerlerin frekansı için tek bir metot var.',
    cozum: 'sonuc = urunler["kategori"].value_counts()',
    aciklama: '<p><code>value_counts()</code> her değerin kaç kez geçtiğini çoktan aza sıralı verir. SQL\'deki <code>GROUP BY kategori + COUNT(*)</code> ile aynı iş.</p><p>Faydalı parametreler: <code>normalize=True</code> oran verir, <code>dropna=False</code> NaN\'ları da sayar (varsayılan olarak NaN sayılmaz).</p>' },
  { id: 'p05', dil: 'python', seviye: 1, kategori: 'Filtreleme', baslik: 'İzmir/Ankara Gold üyeler',
    soru: 'İzmir veya Ankara\'da yaşayan ve üyeliği <code>Gold</code> olan müşterilerin <code>ad_soyad</code>, <code>sehir</code> bilgilerini <code>sonuc</code>\'a ata.',
    ipucu: 'Çoklu değer için <code>isin()</code>, koşulları birleştirmek için <code>&amp;</code> (parantezlere dikkat).',
    cozum: 'kosul = musteriler["sehir"].isin(["İzmir", "Ankara"]) & (musteriler["uyelik"] == "Gold")\nsonuc = musteriler.loc[kosul, ["ad_soyad", "sehir"]]',
    aciklama: '<p>pandas\'ta koşullar <code>and</code>/<code>or</code> ile değil <code>&amp;</code>/<code>|</code> ile bağlanır. Her koşul parantez içinde olmalı, çünkü <code>&amp;</code> operatörü <code>==</code>\'den önce işlenir.</p><p><code>isin()</code>, SQL\'deki <code>IN (...)</code> karşılığıdır.</p>' },
  { id: 'p06', dil: 'python', seviye: 1, kategori: 'pandas Temelleri', baslik: 'En pahalı 5 ürün', sirali: true,
    soru: 'En pahalı 5 ürünün <code>urun_adi</code> ve <code>fiyat</code> bilgisini pahalıdan ucuza <code>sonuc</code>\'a ata.',
    ipucu: '<code>sort_values</code> + <code>head</code>, ya da <code>nlargest</code>.',
    cozum: 'sonuc = urunler.sort_values("fiyat", ascending=False).head(5)[["urun_adi", "fiyat"]]',
    aciklama: '<p><code>sort_values(..., ascending=False)</code> azalan sıralar, <code>head(5)</code> ilk 5\'i alır. Daha kısası: <code>urunler.nlargest(5, "fiyat")</code>.</p><p>SQL karşılığı: <code>ORDER BY fiyat DESC LIMIT 5</code>.</p>' },

  // ───────────── PYTHON · ORTA ─────────────
  { id: 'p07', dil: 'python', seviye: 2, kategori: 'Gruplama', baslik: 'Kanal bazında metrikler',
    soru: 'Tamamlanan siparişler için kanal bazında toplam tutar (<code>toplam</code>) ve ortalama tutarı (<code>ortalama</code>) hesapla, <code>sonuc</code>\'a ata.',
    ipucu: '<code>groupby("kanal").agg(toplam=("tutar","sum"), ...)</code>',
    cozum: 'tamam = siparisler[siparisler["durum"] == "Tamamlandı"]\nsonuc = tamam.groupby("kanal").agg(toplam=("tutar", "sum"),\n                                    ortalama=("tutar", "mean"))',
    aciklama: '<p><b>Named aggregation</b> (<code>yeni_ad=("sütun","fonksiyon")</code>) çıktı sütunlarını doğrudan isimlendirir, MultiIndex sütun karmaşası oluşmaz.</p><p>Sonucun index\'i <code>kanal</code> olur. Tablo gibi kullanmak için sona <code>.reset_index()</code> eklenebilir. SQL\'deki <code>GROUP BY kanal</code> ile birebir aynı mantık.</p>' },
  { id: 'p08', dil: 'python', seviye: 2, kategori: 'Birleştirme', baslik: 'Kategori bazında ciro (merge)',
    soru: 'Tamamlanan siparişleri ürünlerle birleştirip kategori bazında toplam ciroyu bul, büyükten küçüğe sıralı <code>sonuc</code>\'a ata.',
    ipucu: '<code>pd.merge(sol, sag, on="urun_id")</code> → groupby → sort_values.',
    cozum: 'tamam = siparisler[siparisler["durum"] == "Tamamlandı"]\ndf = tamam.merge(urunler[["urun_id", "kategori"]], on="urun_id", how="left")\nsonuc = df.groupby("kategori")["tutar"].sum().sort_values(ascending=False)',
    sirali: true,
    aciklama: '<p><code>merge</code> SQL JOIN\'in karşılığıdır. <code>how</code> parametresi: <code>inner</code> (varsayılan), <code>left</code>, <code>right</code>, <code>outer</code>.</p><p>Ürünlerden sadece gereken sütunları (<code>urun_id</code>, <code>kategori</code>) almak hem belleği korur hem de aynı isimli sütunların <code>_x</code>, <code>_y</code> ekiyle çoğalmasını önler.</p><p>Merge sonrası satır sayısını kontrol etmek iyi bir alışkanlık: <code>len(df) == len(tamam)</code> olmalı. Değilse anahtar tekrarlıyor demektir.</p>' },
  { id: 'p09', dil: 'python', seviye: 2, kategori: 'Tarih', baslik: '2024 aylık sipariş sayısı', sirali: true,
    soru: '2024 yılında her ay kaç sipariş verildiğini (tüm durumlar) ay sırasıyla <code>sonuc</code>\'a ata. Ay "YYYY-MM" formatında olsun.',
    ipucu: '<code>siparis_tarihi</code> zaten datetime. <code>.dt.year</code> ile filtrele, <code>.dt.strftime("%Y-%m")</code> ile grupla.',
    cozum: 'df = siparisler[siparisler["siparis_tarihi"].dt.year == 2024]\nsonuc = df.groupby(df["siparis_tarihi"].dt.strftime("%Y-%m")).size()',
    aciklama: '<p>datetime sütunlarda <code>.dt</code> erişimcisi tarih parçalarını verir: <code>.dt.year</code>, <code>.dt.month</code>, <code>.dt.day_name()</code>.</p><p><code>size()</code> grup başına satır sayısıdır (NaN dahil). <code>count()</code> ise her sütun için NaN olmayanları sayar. Alternatif olarak <code>.dt.to_period("M")</code> ile de gruplanabilir.</p>' },
  { id: 'p10', dil: 'python', seviye: 2, kategori: 'Birleştirme', baslik: 'Siparişsiz müşteriler',
    soru: 'Hiç siparişi olmayan müşterilerin <code>musteri_id</code> ve <code>ad_soyad</code> bilgilerini <code>sonuc</code>\'a ata.',
    ipucu: '<code>~</code> operatörü bir koşulun tersini alır: <code>~df["x"].isin(liste)</code>.',
    cozum: 'siparis_veren = siparisler["musteri_id"].unique()\nsonuc = musteriler.loc[~musteriler["musteri_id"].isin(siparis_veren), ["musteri_id", "ad_soyad"]]',
    aciklama: '<p><code>~</code> boolean serinin tersini alır, yani "listede olmayanlar". SQL\'deki <code>NOT IN</code> ya da anti-join\'in karşılığı.</p><p>Merge ile alternatif: <code>musteriler.merge(siparisler, how="left", indicator=True)</code> yapıp <code>_merge == "left_only"</code> olanları almak.</p>' },
  { id: 'p11', dil: 'python', seviye: 2, kategori: 'Eksik Veri', baslik: 'Eksik yaşları medyanla doldur',
    soru: 'Eksik yaşları yaş medyanı ile doldurduktan sonra yaş ortalamasını hesapla ve <code>sonuc</code>\'a ata (2 ondalık).',
    ipucu: '<code>fillna(df["yas"].median())</code>',
    cozum: 'yas = musteriler["yas"].fillna(musteriler["yas"].median())\nsonuc = round(yas.mean(), 2)',
    aciklama: '<p>Medyan uç değerlerden etkilenmediği için doldurmada ortalamaya göre daha güvenli bir seçim.</p><p>Dikkat: doldurma işlemi ortalamayı değiştirir, ayrıca varyansı yapay olarak düşürür. Gerçek analizde önce eksikliğin nedenini sormak gerekir (rastgele mi, belli bir gruba mı ait?). Mülakatta bunu söylemek çok iyi izlenim bırakır.</p>' },
  { id: 'p12', dil: 'python', seviye: 2, kategori: 'Gruplama', baslik: '12\'den fazla siparişi olanlar',
    soru: 'Müşteri başına sipariş sayısını hesapla (tüm durumlar), 12\'den fazla olanları <code>sonuc</code>\'a ata.',
    ipucu: 'Önce <code>groupby(...).size()</code> ya da <code>value_counts()</code>, sonra filtre.',
    cozum: 'adet = siparisler.groupby("musteri_id").size()\nsonuc = adet[adet > 12]',
    aciklama: '<p>pandas\'ta HAVING diye ayrı bir şey yok: önce grupla, çıkan Series\'i normal bir filtre gibi süz.</p><p>Tek satırlık alternatif: <code>siparisler.groupby("musteri_id").filter(lambda g: len(g) &gt; 12)</code>. Ama bu, grupları değil orijinal satırları döndürür.</p>' },
  { id: 'p13', dil: 'python', seviye: 2, kategori: 'Dönüşüm', baslik: 'Yaş grupları (pd.cut)',
    soru: 'Müşterileri <code>pd.cut</code> ile yaş gruplarına ayır: 18–25 <code>Genç</code>, 26–40 <code>Yetişkin</code>, 41+ <code>Olgun</code>, eksik yaşlar <code>Bilinmiyor</code>. Her gruptaki kişi sayısını <code>sonuc</code>\'a ata.',
    ipucu: '<code>pd.cut(yas, bins=[17, 25, 40, 120], labels=[...])</code>. NaN için önce kategori eklemek gerekir.',
    cozum: 'grup = pd.cut(musteriler["yas"], bins=[17, 25, 40, 120],\n              labels=["Genç", "Yetişkin", "Olgun"])\ngrup = grup.cat.add_categories("Bilinmiyor").fillna("Bilinmiyor")\nsonuc = grup.value_counts()',
    aciklama: '<p><code>pd.cut</code> aralıkları varsayılan olarak <b>sağdan kapalı</b> kurar: (17, 25] 18–25\'i, (25, 40] 26–40\'ı kapsar.</p><p><code>pd.cut</code> sonucu <i>Categorical</i> tiptir. Listede olmayan bir değerle (Bilinmiyor) doldurmak için önce <code>add_categories</code> gerekir, yoksa hata alırsın.</p><p>SQL\'deki CASE WHEN\'in pandas karşılığı. Eşit frekanslı gruplar istenirse <code>pd.qcut</code> kullanılır.</p>' },

  // ───────────── PYTHON · ZOR ─────────────
  { id: 'p14', dil: 'python', seviye: 3, kategori: 'Dönüşüm', baslik: 'Şehir × kanal pivot',
    soru: 'Tamamlanan siparişler için satırlarda <code>sehir</code>, sütunlarda <code>kanal</code>, değerlerde toplam <code>tutar</code> olan bir pivot tablo oluştur. Boş hücreler 0 olsun. Siparişleri müşterilerle birleştirmen gerekecek (şehri boş olan müşteriler pivotta yer almaz). <code>sonuc</code>\'a ata.',
    ipucu: '<code>pd.pivot_table(df, index="sehir", columns="kanal", values="tutar", aggfunc="sum", fill_value=0)</code>',
    cozum: 'tamam = siparisler[siparisler["durum"] == "Tamamlandı"]\ndf = tamam.merge(musteriler[["musteri_id", "sehir"]], on="musteri_id")\nsonuc = pd.pivot_table(df, index="sehir", columns="kanal",\n                       values="tutar", aggfunc="sum", fill_value=0)',
    aciklama: '<p>Pivot tablo, Excel\'deki pivotun aynısı: <code>index</code> satırlar, <code>columns</code> sütunlar, <code>values</code> + <code>aggfunc</code> hücreler.</p><p><code>pivot_table</code> varsayılan olarak index\'teki NaN değerleri (şehri boş müşteriler) dışarıda bırakır. Gerçek analizde bunu fark edip raporlamak önemli.</p><p>SQL\'de aynı iş her kanal için bir <code>SUM(CASE WHEN kanal=\'Online\' THEN tutar END)</code> ile yapılır.</p>' },
  { id: 'p15', dil: 'python', seviye: 3, kategori: 'Gruplama', baslik: 'En çok harcayan 10 müşteri', sirali: true,
    soru: 'Tamamlanan siparişlere göre müşteri başına toplam harcamayı hesapla. En çok harcayan 10 müşteriyi <code>musteri_id</code>, <code>toplam_harcama</code>, <code>sira</code> (en çok harcayan 1) sütunlarıyla bir DataFrame olarak <code>sonuc</code>\'a ata.',
    ipucu: 'groupby → sum → <code>rank(ascending=False, method="min")</code> → sort → head.',
    cozum: 'tamam = siparisler[siparisler["durum"] == "Tamamlandı"]\ndf = tamam.groupby("musteri_id", as_index=False)["tutar"].sum()\ndf = df.rename(columns={"tutar": "toplam_harcama"})\ndf["sira"] = df["toplam_harcama"].rank(ascending=False, method="min").astype(int)\nsonuc = df.sort_values("sira").head(10)',
    aciklama: '<p><code>as_index=False</code> sayesinde groupby sonucu doğrudan düz bir DataFrame olur, reset_index gerekmez.</p><p><code>rank(method=...)</code> SQL\'deki sıralama fonksiyonlarının karşılığı:</p><ul><li><code>"min"</code> → RANK</li><li><code>"dense"</code> → DENSE_RANK</li><li><code>"first"</code> → ROW_NUMBER</li></ul>' },
  { id: 'p16', dil: 'python', seviye: 3, kategori: 'Gruplama', baslik: 'Her kategorinin en pahalısı',
    soru: 'Her kategorideki en pahalı ürünün <code>kategori</code>, <code>urun_adi</code>, <code>fiyat</code> bilgisini <code>sonuc</code>\'a ata.',
    ipucu: '<code>groupby("kategori")["fiyat"].idxmax()</code> en pahalı satırların index\'ini verir.',
    cozum: 'idx = urunler.groupby("kategori")["fiyat"].idxmax()\nsonuc = urunler.loc[idx, ["kategori", "urun_adi", "fiyat"]]',
    aciklama: '<p><code>idxmax()</code> her grupta maksimum değerin bulunduğu satırın index etiketini döner, <code>loc</code> ile o satırlar çekilir.</p><p>Alternatif: <code>urunler.sort_values("fiyat", ascending=False).groupby("kategori").head(1)</code>. Bu kalıp <code>head(3)</code> yazarak "her grubun ilk 3\'ü"ne de kolayca genişletilebilir. SQL\'deki ROW_NUMBER + PARTITION BY\'ın karşılığı.</p>' },
  { id: 'p17', dil: 'python', seviye: 3, kategori: 'RFM', baslik: 'RFM metrikleri',
    soru: 'Tamamlanan siparişler üzerinden her müşteri için RFM metriklerini hesapla. Analiz tarihi <code>2025-01-01</code>. Sütunlar: <code>musteri_id</code>, <code>recency</code> (analiz tarihi − son sipariş, gün), <code>frequency</code> (sipariş sayısı), <code>monetary</code> (toplam tutar). <code>sonuc</code>\'a ata.',
    ipucu: '<code>groupby("musteri_id").agg(recency=("siparis_tarihi", lambda x: ...), ...)</code>',
    cozum: 'analiz_tarihi = pd.Timestamp("2025-01-01")\ntamam = siparisler[siparisler["durum"] == "Tamamlandı"]\nsonuc = tamam.groupby("musteri_id").agg(\n    recency=("siparis_tarihi", lambda x: (analiz_tarihi - x.max()).days),\n    frequency=("siparis_id", "count"),\n    monetary=("tutar", "sum"),\n).reset_index()',
    aciklama: '<p>Miuul\'deki CRM modülünün temeli.</p><ul><li><b>Recency</b>: müşteri en son ne zaman aldı? Küçük olması iyi.</li><li><b>Frequency</b>: kaç kez aldı?</li><li><b>Monetary</b>: toplam ne kadar bıraktı?</li></ul><p>Tarih farkı bir <code>Timedelta</code> döner, <code>.days</code> gün sayısını verir. Analiz tarihini veri setindeki son tarihten 1-2 gün sonrası seçmek standart bir pratik.</p>' },
  { id: 'p18', dil: 'python', seviye: 3, kategori: 'RFM', baslik: 'Monetary segmentleri (qcut)',
    soru: 'Tamamlanan siparişlere göre müşteri başına toplam harcamayı hesapla, <code>pd.qcut</code> ile 4 eşit frekanslı segmente ayır (düşükten yükseğe <code>D</code>, <code>C</code>, <code>B</code>, <code>A</code>). Her segmentteki müşteri sayısını <code>sonuc</code>\'a ata.',
    ipucu: '<code>pd.qcut(seri, q=4, labels=["D","C","B","A"])</code>',
